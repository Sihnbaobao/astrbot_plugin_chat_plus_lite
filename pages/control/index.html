<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Group Chat Plus Lite · 管理控制台</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="hero">
    <div>
      <h1>
        ⚡ Group Chat Plus Lite
        <span class="ver" id="ver">…</span>
      </h1>
      <p class="sub">AI 读空气群聊增强 · 管理控制台（卡片式视图，点击任意胶囊/卡片展开编辑）</p>
    </div>
    <div class="hero-pills">
      <div class="pill"><span class="dot" id="dotMain"></span><span id="mainSwitch">群聊回复：…</span></div>
      <div class="pill" id="tendencyPill">倾向：…</div>
      <div class="pill" id="smartPill">并发：…</div>
    </div>
  </header>

  <!-- 运行时统计 -->
  <section class="section" id="statsSection">
    <h2 class="section-title">📊 运行状态</h2>
    <div class="stats-row" id="statsRow"></div>
  </section>

  <!-- 消息处理流水线 -->
  <section class="section">
    <h2 class="section-title">🧩 消息处理流水线 <span class="tip">点击胶囊展开该环节的配置</span></h2>
    <div class="pipeline" id="pipeline"></div>
    <div id="stagePanelWrap"></div>
  </section>

  <!-- 功能卡片 -->
  <section class="section">
    <h2 class="section-title">🃏 功能开关 <span class="tip">点击卡片展开详细配置</span></h2>
    <div class="cards" id="cards"></div>
    <div id="cardPanelWrap"></div>
  </section>

  <!-- 提示词预览 -->
  <section class="section">
    <h2 class="section-title">📜 提示词预览 <span class="tip">与真实拼接逻辑一致（不含运行时人格注入）</span></h2>
    <div class="prompt-grid" id="promptGrid"></div>
  </section>

  <div class="footer-note">
    保存的配置即时写入插件配置并生效（Smart 并发参数自动同步）。<br />
    提示词/高级参数请到 AstrBot「插件配置」页修改；修改后如需重新加载插件，请重启 AstrBot 或重载插件。
  </div>

  <div id="toast"></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
