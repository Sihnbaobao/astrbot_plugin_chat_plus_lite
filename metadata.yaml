name: astrbot_plugin_chat_plus_lite # 插件唯一识别名（精简重构版）
display_name: chat_plus_lite
desc: 一个以AI读空气为主的群聊聊天效果增强插件（精简重构版） # 插件简短描述
help: 通过AI智能判断是否回复群聊消息，聊天效果增强。V2.4.0-lite（refactor-lite 精简重构版）：插件只决定"要不要回复"，不决定"说什么"——回复内容完全交给 AstrBot 原始链路（用户设定的人格 + 平台默认 prompt），不再注入任何系统行为指令。删除私聊/情绪/注意力/主动对话/等待窗口/对话疲劳/错字/打字模拟/拟人/频率调整/质量评分/回复密度/时间段动态概率/工具提醒文本注入等机制；保留概率筛选、关键词触发、@必回、AI读空气、图片识别、转发解析、黑名单、时间戳/发送者标注、Web面板、戳一戳、Smart并发、livingmemory记忆注入、指令过滤、@全体/@他人过滤、回复去重、内容过滤 # 插件的帮助信息
version: V2.4.0-lite # 插件版本号
author: Him666233 # 原作者（重构维护：Sihnbaobao）
repo: https://github.com/Sihnbaobao/astrbot_plugin_chat_plus_lite # 插件的仓库地址
astrbot_version: ">=4.11.0"