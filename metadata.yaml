name: astrbot_plugin_chat_plus_lite # 插件唯一识别名（精简重构版）
display_name: chat_plus_lite
desc: 一个支持群聊与私聊批处理、以AI读空气为主的聊天效果增强插件（精简重构版） # 插件简短描述
help: 通过AI智能判断是否回复群聊和私聊消息，支持短连发合并、图片与表情包分流、重复表情折叠。0.0.11：插件只决定"要不要回复"，不决定"说什么"；回复内容完全交给 AstrBot 原始链路（用户设定的人格 + 平台默认 prompt），不注入系统行为指令。私聊默认关闭，可按用户白名单启用；纯图片和纯表情包可分别配置 ignore/decide/always 策略。 # 插件的帮助信息
version: 0.0.11 # 插件版本号
author: Sihnbaobao # 插件作者
repo: https://github.com/Sihnbaobao/astrbot_plugin_chat_plus_lite # 插件的仓库地址
astrbot_version: ">=4.11.0"